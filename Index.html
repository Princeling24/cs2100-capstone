<!DOCTYPE html>
<html lang="en">
<head>
    <title> Superhero Maze </title>
    <meta charset="utf-8">
</head>

<body>
    <header><h1> Superhero Maze </h1></header>
    
    <nav> Home | Marvel | DC | Favorites </nav>
    <br>
    
    <Main>
        <h3> Search for a Series </h3>
        <form>
            <label for="search"> </label>
                <input type ="text" id="search" name="search"> <br>
            <button type="submit"> Search </button>
        </form>
        <br><br>

        <section>
        <h3> Results </h3>
            <article class="show-poster">
                <img src="placeholder.jpg" alt="show poster">
            <p> Name </p>
            <p> Rating: 5.0 </p>
            <p> Favorite Status </p>
        </section>
        <br><br>

        <section><h3> Filter Options </h3>
            <label for="status"> Status </label>
            <select id="status">
                <option> On-going </option>
                <option> Completed</option>
                <option> Coming Soon </option>
            </select><br><br>
            
            <label for="type"> Show type </label>
            <select id="type">
                <option> Animated </option>
                <option> Live Action </option>
            </select><br><br>
            
            <label for="genre"> Genre </label>
            <select id="genre">
                <option> Animated </option>
                <option> Adventure </option>
                <option> Comedy </option>
                <option> Drama </option>
            </select><br><br>
            
            Rating
            Studio
        </section>

    </Main>

    <footer>
        <p> Powered by TVMaze API </p>
    </footer>
</body>
</html>
