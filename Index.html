<!DOCTYPE html>
<html lang="en">
<head>
    <title> Superhero Maze </title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="Styles.css">
</head>

<body>
    <header><h1> Superhero Maze </h1></header>
    
    <nav> 
        <a href="index.html"> Home </a>
        <a href="favorites.html"> Favorites </a>
    </nav>
    <br>
    
    <main>
        <h3> Search for a Series </h3>
        <form id="searchForm">
            <label for="search"> Search </label>
                <input type="text" id="search">
            <span class="error" id="searchError"> </span>

            <label for="rating"> Rating (1-10): </label>
            <input type="number" id="rating" min="1" max="10">
            <span class="error" id="ratingError"> </span>

            <label for="email"> Email Address </label>
            <input type="email" id="email">
            <span class="error" id="emailError"> </span>
            <br>
            
            <button type="submit"> Search </button>
        </form>

        <section>
        <h3> Results </h3>
            <div id="resultsContainer">
                <p id="placeholderText"> Search for a show to view results. </p>
            </div>
        </section>
            <article class="show-poster">
                <img src="placeholder.jpg" alt="show poster">
            <p> Name </p>
            <p> Rating </p>
            <p> Favorite Status </p>
            </article>
        <br><br>

        <section><h3> Filter Options </h3>
            <label for="status"> Status </label>
            <select id="status">
                <option> On-going </option>
                <option> Completed</option>
                <option> Coming Soon </option>
            </select>
            <br><br>
            
            <label for="type"> Show type </label>
            <select id="type">
                <option> Animated </option>
                <option> Live Action </option>
            </select>
            <br><br>
            
            <label for="genre"> Genre </label>
            <select id="genre">
                <option> Action </option>
                <option> Adventure </option>
                <option> Comedy </option>
                <option> Drama </option>
            </select>
            <br><br>
            
            <label for="studio"> Studio </label>
            <select id="studio">
                <option> Marvel </option>
                <option> DC </option>
                <option> Netflix </option>
                <option> Amazon </option>
            </select>
            <br><br>
        </section>

    </main>

    <footer>
        <p> Powered by TVMaze API </p>
    </footer>

    <script src="app.js"></script>
    
</body>
</html>
