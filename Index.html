<!DOCTYPE html>
<html lang="en">
<head>
    <title> Superhero Maze </title>
    <meta charset="utf-8">
</head>

<body>
    <header><h1> Superhero Maze </h1></header>
    
    <nav> Home | Marvel | DC | Favorites </nav>
    <br>
    
    <Main>
        <h3> Search for a Series </h3>
        <form>
            <label for="search"> </label>
                <input type ="text" id="search" name="search"> <br>
            <button type="submit"> Search </button>
        </form>
        <br><br>

        <h3> Results </h3>
            <article class="show-poster">
                <im src="placeholder.jpg" alt="show poster">
            <p> Name </p>
            <p> Rating </p>
            <p> Favorite Status </p>
        <br><br>

        Filter Options (right):
            Status (on-going, completed, or coming soon)
            Show type (animated or live action)
            Genre
            Rating
            Studio

    </Main>

    <footer>
        <p> Powered by TVMaze API </p>
    </footer>
</body>
</html>
